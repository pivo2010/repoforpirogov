services:
  web:
    build:
      context: /Users/user/Documents/phpcalc
      dockerfile: Dockerfile
    container_name: phpcalc_web
    ports:
      - "8080:80"
    volumes:
      - /Users/user/Documents/phpcalc:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: phpcalc
      DB_USER: phpcalc
      DB_PASS: phpcalc_password
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: phpcalc_db
    environment:
      POSTGRES_DB: phpcalc
      POSTGRES_USER: phpcalc
      POSTGRES_PASSWORD: phpcalc_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: