<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    input, button {
      padding: 6px;
      margin: 4px;
    }
  </style>
</head>
<body>

<h2>Калькулятор</h2>

<p>
  <input id="a" type="number" placeholder="A">
  <input id="b" type="number" placeholder="B">
</p>

<p>
  <button onclick="calc('+')">+</button>
  <button onclick="calc('-')">-</button>
  <button onclick="calc('*')">*</button>
  <button onclick="calc('/')">/</button>
</p>

<p>
  Результат:
  <strong id="res">—</strong>
</p>

<script>
function calc(op) {
  const a = Number(document.getElementById('a').value);
  const b = Number(document.getElementById('b').value);

  let r;
  if (op === '+') r = a + b;
  if (op === '-') r = a - b;
  if (op === '*') r = a * b;
  if (op === '/') r = b === 0 ? 'Ошибка' : a / b;

  document.getElementById('res').textContent = r;
}
</script>

</body>
</html>
